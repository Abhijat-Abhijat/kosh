name: Bug report
description: Something in Kosh doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Don't paste real SMS, account numbers, balances or backup files.** Redact anything personal.
        Security problems go through a [private advisory](https://github.com/Abhijat-Abhijat/kosh/security/advisories/new) instead.
        If a bank SMS isn't recognised, use the **SMS format request** template.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kosh version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone model
      placeholder: "Android 14, Pixel 7"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install Kosh?
      options:
        - APK from GitHub Releases
        - Built from source
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Optional. Blur any amounts, names or account digits.
