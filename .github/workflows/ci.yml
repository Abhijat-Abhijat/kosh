name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["website/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx jest --ci --forceExit
